name: lab

on:
  push:
    branches:
      - '@ABLalgorithm'
  pull_request:
    branches:
      - '@ABLalgorithm'

permissions:
  contents: read

jobs:
  any-amount:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspaces/any-amount
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx tsx src/cli.ts --help

  addon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addons/optn-shielded-pool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
